name: Android Cloud APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Restore Debug Keystore
        env:
          SECRET_DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from repository debug.keystore.base64"
          elif [ -n "$SECRET_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$SECRET_DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret"
          elif [ ! -f debug.keystore ]; then
            echo "::warning::No stored debug keystore; generating an ephemeral one (SHA-1 will not match Firebase)."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true

      - name: Restore google-services.json from Secret (if configured)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Configure Optional App Check & Firebase Overrides from Secrets
        env:
          CI_APPCHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
          CI_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          CI_FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
        run: |
          if [ -n "$CI_APPCHECK_DEBUG_TOKEN" ] || [ -n "$CI_RECAPTCHA_SITE_KEY" ] || [ -n "$CI_FIRESTORE_DATABASE_ID" ]; then
            {
              printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              if [ -n "$CI_APPCHECK_DEBUG_TOKEN" ]; then
                printf '    <string name="ci_appcheck_debug_token" translatable="false">%s</string>\n' "$CI_APPCHECK_DEBUG_TOKEN"
              fi
              if [ -n "$CI_RECAPTCHA_SITE_KEY" ]; then
                printf '    <string name="ci_recaptcha_site_key" translatable="false">%s</string>\n' "$CI_RECAPTCHA_SITE_KEY"
              fi
              if [ -n "$CI_FIRESTORE_DATABASE_ID" ]; then
                printf '    <string name="ci_firestore_database_id" translatable="false">%s</string>\n' "$CI_FIRESTORE_DATABASE_ID"
              fi
              printf '</resources>\n'
            } > app/src/main/res/values/ci_appcheck_config.xml
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Name the APK after the app
        run: cp app/build/outputs/apk/debug/app-debug.apk CinemaRoya-Studio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CinemaRoya-Studio
          path: CinemaRoya-Studio.apk
          if-no-files-found: error
